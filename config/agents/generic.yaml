# Template for adding ANY agent. Copy to config/agents/<name>.yaml, fill in, run `make eval`.
# docs/AGENT_INTEGRATION.md explains every field. This file itself is never routed to
# (its `binary` is a placeholder), but it must always validate.
schema_version: 1
name: generic
display_name: Generic agent (template)
binary: your-agent-cli

invoke:
  # Headless invocation, run with cwd = the task worktree.
  # Placeholders: {prompt} (inline text), {prompt_file} (path to the task brief), {model}.
  args: [run, --headless, --prompt-file, "{prompt_file}", --model, "{model}"]
  prompt_entry: file              # argument | stdin | file
  forbidden_args: []              # flags that spawn sub-agents or disable safety (R13)
  env_passthrough: []             # env vars the agent needs (secrets are passed, never stored)
  result_path: null               # dotted path to the final answer text; null = raw stdout

usage:                            # how to read REAL usage from its output (R10)
  source: none                    # json_stdout | jsonl_stdout | none (=> unaccounted)
  event_type: null
  model_path: null                # dotted path, "@first_key" step, or "@arg_model"
  input_paths: []                 # dotted paths, summed
  output_paths: []
  cost_path: null

capacity_probe:                   # commands (args after the binary); null = unknown
  auth: null
  models: null
  quota: null                     # null => capacity-blind => review mode only

models: [default]

notes: |
  Describe quirks here; durable lessons belong in brain/BRAIN.md.
