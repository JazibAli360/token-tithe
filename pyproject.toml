[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "token-tithe"
version = "0.1.0"
description = "Self-contained engine that donates leftover AI-agent tokens to open source."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer==0.12.5",
    "click==8.1.7",
    "PyYAML==6.0.2",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[project.scripts]
donate = "token_tithe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/token_tithe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501"]  # asserts; subprocess is core; formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
