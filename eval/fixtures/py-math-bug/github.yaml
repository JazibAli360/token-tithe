issues:
  - number: 12
    title: moving_average drops the last window
    labels: [good first issue, bug]
    created_days_ago: 9
    body: |
      `moving_average` returns one value too few. The docstring says:

      ```python
      >>> moving_average([1, 2, 3, 4], 2)
      [1.5, 2.5, 3.5]
      ```

      but it actually returns `[1.5, 2.5]`. With `window == len(values)` it returns `[]`
      instead of the single mean.
    comments:
      - {user: mk-maintainer, association: OWNER, days_ago: 8,
         body: "Confirmed, looks like an off-by-one in the range. PRs welcome (please add a test)."}
