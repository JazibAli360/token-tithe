name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git make
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make setup
      - run: make lint
      - run: make test
      - run: make doctor
      - run: make simulate
      - name: eval (fast subset)
        run: .venv/bin/python eval/run_eval.py --fast
