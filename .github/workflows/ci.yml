name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    env:                       # plain CLI output so tests can match text
      NO_COLOR: "1"
      TERM: dumb
      COLUMNS: "200"
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git make gh
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make setup
      - run: make lint
      - run: make test
      - run: make doctor
      - run: make simulate
      - name: eval (fast subset)
        run: .venv/bin/python eval/run_eval.py --fast

  quickstart:                  # a fresh Linux user's first command, non-interactive (no TTY)
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/quickstart.sh < /dev/null
      - name: shared config untouched
        run: git diff --exit-code -- config/ && test ! -e config/policy.local.yaml
