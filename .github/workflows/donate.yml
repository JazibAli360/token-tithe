name: donate
# Scheduled/manual run. CI NEVER passes --live: this workflow can only dry-run.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git make
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make setup
      - run: .venv/bin/donate doctor
      - run: .venv/bin/donate run --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donate-dry-run-${{ github.run_id }}
          path: state/
